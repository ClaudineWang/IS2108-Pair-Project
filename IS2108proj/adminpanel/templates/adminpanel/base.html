<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .admin-header {
            background: #bea989;
            color: white;
            padding: 18px 22px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .brand-title {
            margin: 0;
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .main-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            margin-top: 16px;
            padding-top: 14px;
        }

        .nav-link {
            color: #e5eef7;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 7px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            background: white;
            color: #17324d;
            text-decoration: none;
        }

        .currency-form {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            color: white;
        }

        .currency-form select {
            padding: 7px;
        }

        .logout-form {
            margin: 0;
        }

        .logout-button {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .logout-button:hover {
            background: white;
            color: #17324d;
        }

        @media (max-width: 700px) {
            .main-nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-link {
                text-align: center;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .content-panel {
                background: white;
                border: 1px solid #d6dce3;
                border-radius: 12px;
                padding: 24px;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <div class="container">
        <header class="admin-header">
            <div class="brand-row">
                <h1 class="brand-title">BrewMatch Admin </h1>

                <div class="header-actions">
                    <form method="get" class="currency-form">
                        <label for="currency">Currency:</label>

                        <select name="currency" id="currency">
                            <option value="SGD" {% if selected_currency == "SGD" %}selected{% endif %}>
                                SGD
                            </option>
                            <option value="USD" {% if selected_currency == "USD" %}selected{% endif %}>
                                USD
                            </option>
                            <option value="EUR" {% if selected_currency == "EUR" %}selected{% endif %}>
                                EUR
                            </option>
                        </select>
                    </form>

                    {% if request.user.is_authenticated %}
                    <form method="post" action="{% url 'adminpanel:admin_logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="logout-button">
                            Sign out
                        </button>
                    </form>
                    {% endif %}
                </div>
            </div>

            <nav class="main-nav" aria-label="Admin navigation">
                <a class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}"
                    href="{% url 'adminpanel:admin_dashboard' %}">
                    Dashboard
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}"
                    href="{% url 'adminpanel:product_list' %}">
                    Products
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'inventory_list' %}active{% endif %}"
                    href="{% url 'adminpanel:inventory_list' %}">
                    Inventory
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'order_list' %}active{% endif %}"
                    href="{% url 'adminpanel:order_list' %}">
                    Orders
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'customer_list' %}active{% endif %}"
                    href="{% url 'adminpanel:customer_list' %}">
                    Customers
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'subscription_bundle_list' %}active{% endif %}"
                    href="{% url 'adminpanel:subscription_bundle_list' %}">
                    Bundles
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'customer_subscription_list' %}active{% endif %}"
                    href="{% url 'adminpanel:customer_subscription_list' %}">
                    Customer Subscriptions
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'review_list' %}active{% endif %}"
                    href="{% url 'adminpanel:review_list' %}">
                    Reviews
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'predictions' %}active{% endif %}"
                    href="{% url 'adminpanel:predictions' %}">
                    Predictions
                </a>
            </nav>
        </header>

        <main class="content-panel">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currencySelect = document.getElementById("currency");
            if (!currencySelect) return;

            const formKey = "admin_form_draft";
            const rates = { SGD: 1, USD: 0.74, EUR: 0.68 };

            function convertAmount(value, fromCurrency, toCurrency) {
                const numeric = Number(value);
                if (!Number.isFinite(numeric)) return value;

                const fromRate = rates[fromCurrency] || 1;
                const toRate = rates[toCurrency] || 1;

                const sgdValue = numeric / fromRate;
                return (sgdValue * toRate).toFixed(2);
            }

            function buildDraftFromForm(form) {
                const draft = {};

                Array.from(form.elements).forEach(function (field) {
                    if (!field.name || field.disabled) return;
                    if (field.type === "submit" || field.type === "button") return;
                    if (field.type === "file") return;
                    if (field.name === "currency") return;

                    if (field.type === "checkbox" || field.type === "radio") {
                        if (!field.checked) return;
                        if (Object.prototype.hasOwnProperty.call(draft, field.name)) {
                            if (!Array.isArray(draft[field.name])) {
                                draft[field.name] = [draft[field.name]];
                            }
                            draft[field.name].push(field.value);
                        } else {
                            draft[field.name] = field.value;
                        }
                        return;
                    }

                    if (field.name === "price" || field.name === "price_per_delivery") {
                        const current = field.value;
                        if (current !== "") {
                            draft[field.name] = current;
                        }
                        return;
                    }

                    if (field.value !== "") {
                        if (Object.prototype.hasOwnProperty.call(draft, field.name)) {
                            if (!Array.isArray(draft[field.name])) {
                                draft[field.name] = [draft[field.name]];
                            }
                            draft[field.name].push(field.value);
                        } else {
                            draft[field.name] = field.value;
                        }
                    }
                });

                return draft;
            }

            function restoreDraftToForm(form, draft) {
                if (!draft) return;

                Object.entries(draft).forEach(function ([name, value]) {
                    const matches = Array.from(form.querySelectorAll(`[name="${name}"]`));

                    if (!matches.length) return;

                    const values = Array.isArray(value) ? value : [value];

                    matches.forEach(function (field, index) {
                        const savedValue = values[index] ?? values[0];

                        if (field.type === "checkbox") {
                            field.checked = String(field.value) === String(savedValue);
                        } else if (field.type === "radio") {
                            field.checked = String(field.value) === String(savedValue);
                        } else if (field.type !== "file") {
                            field.value = savedValue;
                        }
                    });
                });
            }

            const savedDraft = sessionStorage.getItem(formKey);
            const mainForm = document.querySelector("main form");
            if (savedDraft && mainForm) {
                try {
                    restoreDraftToForm(mainForm, JSON.parse(savedDraft));
                } catch (e) {
                    console.warn("Failed to restore draft form:", e);
                }
            }

            currencySelect.addEventListener("change", function () {
                const currentParams = new URLSearchParams(window.location.search);
                const formCurrency = document.getElementById("form-currency");
                const oldCurrency =
                    currentParams.get("currency") ||
                    (formCurrency && formCurrency.value) ||
                    "SGD";
                const newCurrency = this.value;

                if (typeof window.saveDraftBeforeCurrencyChange === "function") {
                    window.saveDraftBeforeCurrencyChange(oldCurrency, newCurrency);
                }

                const mainForm = document.querySelector("main form");
                if (mainForm) {
                    const draft = buildDraftFromForm(mainForm);

                    Object.entries(draft).forEach(function ([name, value]) {
                        if (name === "price" || name === "price_per_delivery") {
                            const converted = convertAmount(value, oldCurrency, newCurrency);
                            draft[name] = converted;
                        }
                    });

                    sessionStorage.setItem(formKey, JSON.stringify(draft));
                }

                currentParams.set("currency", newCurrency);
                window.location.search = currentParams.toString();
            });

            const forms = document.querySelectorAll("form");
            forms.forEach(function (form) {
                form.addEventListener("submit", function () {
                    sessionStorage.removeItem(formKey);
                });
            });
        });
    </script>

</body>

</html>
