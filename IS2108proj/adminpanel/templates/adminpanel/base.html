<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 24px;
        }

        .topbar nav {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .topbar a {
            text-decoration: none;
            color: #1d4ed8;
            font-weight: 600;
        }

        .page-title {
            margin: 0;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        input,
        select,
        button {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background: #1d4ed8;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 12px;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f2f2f2;
        }

        .status-visible {
            color: green;
            font-weight: bold;
        }

        .status-hidden {
            color: red;
            font-weight: bold;
        }

        .page-actions {
            margin-top: 18px;
        }

        a {
            color: #1d4ed8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .currency-form {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 0;
        }

        .currency-form label {
            font-weight: 600;
        }

        .logout-form {
            display: inline;
            margin: 0;
        }

        .logout-button {
            background: transparent;
            color: #1d4ed8;
            border: none;
            padding: 0;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-button:hover {
            text-decoration: underline;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <div class="container">
        <header class="topbar">
            <h1 class="page-title">BrewMatch Admin</h1>
            <nav>
                <a href="{% url 'adminpanel:product_list' %}">Products</a>
                <a href="{% url 'adminpanel:inventory_list' %}">Inventory</a>
                <a href="{% url 'adminpanel:order_list' %}">Orders</a>
                <a href="{% url 'adminpanel:customer_list' %}">Customers</a>
                <a href="{% url 'adminpanel:subscription_bundle_list' %}">Subscriptions</a>
                <a href="{% url 'adminpanel:review_list' %}">Reviews</a>
                {% if request.user.is_authenticated %}
                <form method="post" action="{% url 'adminpanel:admin_logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-button">
                        Sign out
                    </button>
                </form>
                {% endif %}
            </nav>

            <form method="get" class="currency-form">
                <label for="currency">Currency:</label>
                <select name="currency" id="currency">
                    <option value="SGD" {% if selected_currency == "SGD" %}selected{% endif %}>SGD</option>
                    <option value="USD" {% if selected_currency == "USD" %}selected{% endif %}>USD</option>
                    <option value="EUR" {% if selected_currency == "EUR" %}selected{% endif %}>EUR</option>
                </select>
            </form>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currencySelect = document.getElementById("currency");
            if (!currencySelect) return;

            const formKey = "admin_form_draft";
            const rates = { SGD: 1, USD: 0.74, EUR: 0.68 };

            function convertAmount(value, fromCurrency, toCurrency) {
                const numeric = Number(value);
                if (!Number.isFinite(numeric)) return value;

                const fromRate = rates[fromCurrency] || 1;
                const toRate = rates[toCurrency] || 1;

                const sgdValue = numeric / fromRate;
                return (sgdValue * toRate).toFixed(2);
            }

            function buildDraftFromForm(form) {
                const draft = {};

                Array.from(form.elements).forEach(function (field) {
                    if (!field.name || field.disabled) return;
                    if (field.type === "submit" || field.type === "button") return;
                    if (field.type === "file") return;
                    if (field.name === "currency") return;

                    if (field.type === "checkbox" || field.type === "radio") {
                        if (!field.checked) return;
                        if (Object.prototype.hasOwnProperty.call(draft, field.name)) {
                            if (!Array.isArray(draft[field.name])) {
                                draft[field.name] = [draft[field.name]];
                            }
                            draft[field.name].push(field.value);
                        } else {
                            draft[field.name] = field.value;
                        }
                        return;
                    }

                    if (field.name === "price" || field.name === "price_per_delivery") {
                        const current = field.value;
                        if (current !== "") {
                            draft[field.name] = current;
                        }
                        return;
                    }

                    if (field.value !== "") {
                        if (Object.prototype.hasOwnProperty.call(draft, field.name)) {
                            if (!Array.isArray(draft[field.name])) {
                                draft[field.name] = [draft[field.name]];
                            }
                            draft[field.name].push(field.value);
                        } else {
                            draft[field.name] = field.value;
                        }
                    }
                });

                return draft;
            }

            function restoreDraftToForm(form, draft) {
                if (!draft) return;

                Object.entries(draft).forEach(function ([name, value]) {
                    const matches = Array.from(form.querySelectorAll(`[name="${name}"]`));

                    if (!matches.length) return;

                    const values = Array.isArray(value) ? value : [value];

                    matches.forEach(function (field, index) {
                        const savedValue = values[index] ?? values[0];

                        if (field.type === "checkbox") {
                            field.checked = String(field.value) === String(savedValue);
                        } else if (field.type === "radio") {
                            field.checked = String(field.value) === String(savedValue);
                        } else if (field.type !== "file") {
                            field.value = savedValue;
                        }
                    });
                });
            }

            const savedDraft = sessionStorage.getItem(formKey);
            const mainForm = document.querySelector("main form");
            if (savedDraft && mainForm) {
                try {
                    restoreDraftToForm(mainForm, JSON.parse(savedDraft));
                } catch (e) {
                    console.warn("Failed to restore draft form:", e);
                }
            }

            currencySelect.addEventListener("change", function () {
                const currentParams = new URLSearchParams(window.location.search);
                const formCurrency = document.getElementById("form-currency");
                const oldCurrency =
                    currentParams.get("currency") ||
                    (formCurrency && formCurrency.value) ||
                    "SGD";
                const newCurrency = this.value;

                if (typeof window.saveDraftBeforeCurrencyChange === "function") {
                    window.saveDraftBeforeCurrencyChange(oldCurrency, newCurrency);
                }

                const mainForm = document.querySelector("main form");
                if (mainForm) {
                    const draft = buildDraftFromForm(mainForm);

                    Object.entries(draft).forEach(function ([name, value]) {
                        if (name === "price" || name === "price_per_delivery") {
                            const converted = convertAmount(value, oldCurrency, newCurrency);
                            draft[name] = converted;
                        }
                    });

                    sessionStorage.setItem(formKey, JSON.stringify(draft));
                }

                currentParams.set("currency", newCurrency);
                window.location.search = currentParams.toString();
            });

            const forms = document.querySelectorAll("form");
            forms.forEach(function (form) {
                form.addEventListener("submit", function () {
                    sessionStorage.removeItem(formKey);
                });
            });
        });
    </script>

</body>

</html>
