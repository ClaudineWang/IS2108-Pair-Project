{% extends "base.html" %}

{% block title %}Customer Login{% endblock %}

{% block content %}
<style>
    .auth-card {
        max-width: 480px;
        margin: 40px auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        padding: 32px 28px;
    }

    .auth-card h1 {
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .field label {
        font-weight: 600;
    }

    .field input {
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
    }

    .btn {
        background: #bea989;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
    }

    .btn:hover {
        background: #755f3e;
    }

    .message {
        padding: 10px 12px;
        border-radius: 8px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        margin-bottom: 12px;
    }

    .helper {
        text-align: center;
        margin-top: 12px;
    }

    .helper a {
        color: #1d4ed8;
        text-decoration: none;
        font-weight: 600;
    }
</style>

<div class="auth-card">
    <h1>Welcome back to BrewMatch!</h1>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn">Log in</button>
    </form>

    <div class="helper">
        Don’t have an account?
        <a href="{% url 'customer:customer_signup' %}">Sign up</a>
    </div>
</div>
{% endblock %}
