<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BrewMatch{% endblock %}</title>
    <style>
        :root {
            --ink: #282520;
            --muted: #716b62;
            --line: #ded8ce;
            --paper: #fffefa;
            --cream: #f7f3eb;
            --coffee: #70452f;
            --coffee-dark: #4b3023;
            --accent: #e7d4be;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.5;
        }

        button, input, select, textarea { font: inherit; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            min-height: 82px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 24px;
            background: var(--paper);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--coffee-dark);
            font-size: 1.8rem;
            line-height: 1;
            text-decoration: none;
        }

        .brand:hover {
            text-decoration: none;
        }

        .brand-mark { font-size: 1.9rem; }
        .brand-name { font-size: 1rem; font-weight: 700; }

        .top-actions,
        .top-actions nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pill-link {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
            transition: background-color .15s ease, border-color .15s ease;
        }

        .pill-link:hover {
            background: var(--accent);
            text-decoration: none;
        }

        .page-title {
            margin: 0;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background: var(--coffee);
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 12px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            background: var(--cream);
        }

        .status-visible {
            color: green;
            font-weight: bold;
        }

        .status-hidden {
            color: red;
            font-weight: bold;
        }

        .page-actions {
            margin-top: 18px;
        }

        a {
            color: var(--coffee-dark);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}" aria-label="BrewMatch home">
            <span class="brand-mark" aria-hidden="true">☕</span>
            <span class="brand-name">BrewMatch</span>
        </a>

        <div class="top-actions">
            <nav aria-label="Public navigation">
                <a class="pill-link" href="{% url 'home' %}">Home</a>
                <a class="pill-link" href="{% url 'adminpanel:admin_login' %}">Admin Panel</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
